<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, initial-scale=1.0">
  <title>Project Mesto</title>
  <link rel="stylesheet" href="style/main.css">
</head>
<body>
  <!-- хедер -->
<header class="header">
  <img src="icons/logo.svg" alt="Логотип Mesto" class="logo">
</header>

  <!-- профиль -->
  <section class="profile">
    <img src="images/zlata avatar 1.png" alt="Аватар" class="profile__avatar">
   
    <div class="profile__info">
       <div class="profile__name-block">
        <h1 class="profile__title">Злата Чумак</h1>
        <button class="profile__edit" aria-label="Редактировать"></button>
        
      </div>
      <p class="profile__subtitle">Исследователь</p>
     </div>

      <button class="profile__add-button" type="button">
        <img src="icons/+.svg" alt="добавить">
      </button>
  </section>

  <!-- галерея -->
  <section class="gallery">
  </section>




<!-- модальное окно Редактировать профиль -->
<div class="popup popup_type_edit">
  <div class="popup__content">
      <!-- [08.10.2025 TODO №3]: Кнопка должна менять свое положение для размера экрана мобильный устройств-->
    <button class="popup__close" type="button"></button>
    <h2 class="popup__title">Редактировать профиль</h2>
    <form class="popup__form">
      <input
        type="text"
        name="name__person"
        class="popup__input"
        placeholder="Имя"
        required
      />
      <input
        type="text"
        name="profession"
        class="popup__input"
        placeholder="Профессия"
        required
      />
      <button type="submit" class="popup__save">Сохранить</button>
    </form>
  </div>
</div>


<!-- модальное окно 2 добавить карточку -->
 <div class="popup popup_type_add">
  <div class="popup__content">
    <button class="popup__close" type="button"></button>
    <h2 class="popup__title">Новое место</h2>
    <form class="popup__form" name="add-card-form">
      <input
        type="text"
        name="name"
        class="popup__input"
        placeholder="Название"
        required
        minlength="2"
        maxlength="30"
      />
      <input
        type="url"
        name="link"
        class="popup__input"
        placeholder="Ссылка на картинку"
        required
      />
      <button type="submit" class="popup__save">Сохранить</button>
    </form>
  </div>
</div>


  <!-- футер -->
  <footer class="footer">
    <p>© 2025 Russia</p>
  </footer>
 <script type="module" src="./javaScript/api.js"></script>
  <script type="module" src="./javaScript/main.js"></script>
  <script type="module" src="./javaScript/card.js"></script>
  <script type="module" src="./javaScript/modal.js"></script>
  <script type="module" src="./javaScript/utils.js"></script>

 
  <!-- <script type="module" src="./javaScript/"></script> -->


</body>
</html>
